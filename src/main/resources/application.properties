spring.application.name=newblog
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/blogdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
server.port=8080

# 站点配置（前端横幅与主题配色）
blog.title=探索，永无止境
blog.subtitle=分享技术，记录生活
# 默认主题色：green（主白副绿） 或 red（主白副红）
blog.theme=green
blog.copyright=© 2026 我的博客 | Powered by SpringBoot3 + JDK21
blog.base-url=http://localhost:8080

# 系统上线日期（用于仪表盘“运行天数”），格式 yyyy-MM-dd
blog.launch-date=2026-01-01

# JWT 配置
blog.jwt.secret=Yiblog-Graduation-Project-Secret-Key-2026-Please-Change-Me-32bytes
blog.jwt.expire-hours=24
blog.jwt.issuer=yiblog

# 允许跨域的前端来源（多个用英文逗号分隔）
blog.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

