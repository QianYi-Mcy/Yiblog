<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .article-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .article-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #222;
        }
        .article-card h2 a {
            color: #222;
            text-decoration: none;
        }
        .article-card h2 a:hover {
            color: #667eea;
        }
        .article-summary {
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .article-meta {
            display: flex;
            gap: 20px;
            color: #999;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的博客</h1>
        <p>分享技术，记录生活</p>
    </div>

    <div class="container">
        <div class="article-card" th:each="article : ${articles}">
            <h2>
                <a th:href="@{'/article/' + ${article.id}}" th:text="${article.title}">文章标题</a>
            </h2>
            <p class="article-summary" th:text="${article.summary}">文章摘要</p>
            <div class="article-meta">
                <span>👁 浏览 <span th:text="${article.views}">0</span></span>
                <span>📅 <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">2026-01-01</span></span>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 我的博客 | Powered by SpringBoot3 + JDK21</p>
    </div>
</body>
</html>
