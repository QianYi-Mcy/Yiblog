<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-default-theme=${site} != null ? ${site.theme} : 'green'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${site} != null ? ${site.title} : '我的博客'">我的博客</title>
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题配色">
        <span class="dot"></span>
        <span id="themeLabel">绿色主题</span>
    </button>

    <div class="header">
        <h1>探索<span class="accent">，</span>永无止境</h1>
        <p th:text="${site} != null ? ${site.subtitle} : '分享技术，记录生活'">分享技术，记录生活</p>
        <div class="divider"></div>
    </div>

    <div class="container">
        <div class="flash-msg" th:if="${message}" th:text="${message}">提示</div>
        <div class="article-card" th:each="article : ${articles}">
            <h2>
                <a th:href="@{'/article/' + ${article.id}}" th:text="${article.title}">文章标题</a>
            </h2>
            <p class="article-summary" th:text="${article.summary}">文章摘要</p>
            <div class="article-meta">
                <span>👁 浏览 <span th:text="${article.views}">0</span></span>
                <span>📅 <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">2026-01-01</span></span>
            </div>
        </div>
    </div>

    <div class="footer">
        <p th:text="${site} != null ? ${site.copyright} : '© 2026 我的博客 | Powered by SpringBoot3 + JDK25'">© 2026 我的博客</p>
    </div>
</body>
</html>
