<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 文章管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .header {
            background: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h1 {
            font-size: 20px;
            color: #333;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .user-info span {
            color: #666;
        }
        .header .user-info a {
            color: #667eea;
            text-decoration: none;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .toolbar h2 {
            font-size: 18px;
        }
        .add-btn {
            padding: 10px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .article-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }
        td {
            font-size: 14px;
        }
        .title-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-published {
            color: #52c41a;
        }
        .status-draft {
            color: #faad14;
        }
        .action-links a {
            margin-right: 12px;
            text-decoration: none;
            font-size: 13px;
        }
        .edit-link {
            color: #667eea;
        }
        .delete-link {
            color: #e74c3c;
        }
        .empty-tip {
            text-align: center;
            padding: 60px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>博客后台管理系统</h1>
        <div class="user-info">
            <span>欢迎，<span th:text="${user.nickname}">管理员</span></span>
            <a href="/logout">退出登录</a>
        </div>
    </div>

    <div class="container">
        <div class="toolbar">
            <h2>文章管理</h2>
            <a href="/admin/article/add" class="add-btn">+ 写新文章</a>
        </div>

        <div class="article-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>标题</th>
                        <th>浏览量</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.id}">1</td>
                        <td class="title-cell" th:text="${article.title}">文章标题</td>
                        <td th:text="${article.views}">0</td>
                        <td>
                            <span class="status-published" th:if="${article.status == 1}">已发布</span>
                            <span class="status-draft" th:if="${article.status == 0}">草稿</span>
                        </td>
                        <td th:text="${article.createTime}">2026-01-01</td>
                        <td class="action-links">
                            <a th:href="@{'/article/' + ${article.id}}" target="_blank" class="edit-link">查看</a>
                            <a th:href="@{'/admin/article/edit/' + ${article.id}}" class="edit-link">编辑</a>
                            <a th:href="@{'/admin/article/delete/' + ${article.id}}" class="delete-link" onclick="return confirm('确定删除这篇文章吗？')">删除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-tip" th:if="${#lists.isEmpty(articles)}">
                暂无文章，点击右上角"写新文章"开始创作吧！
