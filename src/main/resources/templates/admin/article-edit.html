<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-default-theme=${site} != null ? ${site.theme} : 'green'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑</title>
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <script th:src="@{/js/theme.js}"></script>
    <style>
        .header {
            position: relative;
            z-index: 1;
            margin: 20px auto 0;
            max-width: 900px;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        .header h1 {
            font-size: 20px;
            color: var(--text-main);
        }
        .header a {
            color: var(--accent);
            text-decoration: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .edit-box {
            background: rgba(255, 255, 255, 0.66);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.10);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.7);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 300px;
            font-family: inherit;
        }
        .row {
            display: flex;
            gap: 20px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.25s, transform 0.2s;
        }
        .btn-primary {
            background: var(--accent-grad);
            color: white;
            box-shadow: 0 8px 20px var(--accent-glow);
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(0, 0, 0, 0.06);
            color: var(--text-sub);
        }
        .tip {
            color: var(--text-mute);
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题配色">
        <span class="dot"></span>
        <span id="themeLabel">绿色主题</span>
    </button>

    <div class="header">
        <h1>文章编辑</h1>
        <a href="/admin">← 返回文章列表</a>
    </div>

    <div class="container">
        <div class="edit-box">
            <form id="articleForm">
                <input type="hidden" id="id" th:value="${article?.id}">

                <div class="form-group">
                    <label>文章标题</label>
                    <input type="text" id="title" placeholder="请输入文章标题" th:value="${article?.title}" required>
                </div>

                <div class="form-group">
                    <label>文章摘要</label>
                    <textarea id="summary" rows="3" placeholder="一句话概括文章内容" th:text="${article?.summary}"></textarea>
                </div>

                <div class="form-group">
                    <label>文章内容</label>
                    <textarea id="content" placeholder="请输入文章内容，支持HTML标签" th:text="${article?.content}"></textarea>
                    <div class="tip">支持HTML标签，比如 &lt;p&gt;段落&lt;/p&gt;、&lt;h2&gt;标题&lt;/h2&gt;</div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>发布状态</label>
                        <select id="status">
                            <option value="1">立即发布</option>
                            <option value="0">存为草稿</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>分类ID（可选）</label>
                        <input type="text" id="categoryId" placeholder="分类ID" th:value="${article?.categoryId}">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">保存文章</button>
                    <a href="/admin" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        // 编辑模式下，回填发布状态下拉框
        var articleStatus = /*[[${article?.status}]]*/ null;
        if (articleStatus !== null && articleStatus !== undefined) {
            document.getElementById('status').value = articleStatus;
        }

        document.getElementById('articleForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var id = document.getElementById('id').value;
            var categoryId = document.getElementById('categoryId').value;
            var data = {
                title: document.getElementById('title').value,
                summary: document.getElementById('summary').value,
                content: document.getElementById('content').value,
                status: parseInt(document.getElementById('status').value, 10),
                categoryId: categoryId ? parseInt(categoryId, 10) : null
            };

            var url = id ? '/api/article/update' : '/api/article/add';
            if (id) {
                data.id = parseInt(id, 10);
            }

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
                .then(function (res) { return res.json(); })
                .then(function (res) {
                    alert(res.message);
                    if (res.code === 200) {
                        window.location.href = '/admin';
                    }
                })
                .catch(function (err) {
                    alert('保存失败：' + err.message);
                });
        });
    </script>
</body>
</html>
