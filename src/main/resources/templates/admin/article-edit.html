<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .header {
            background: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header h1 {
            font-size: 20px;
        }
        .header a {
            color: #667eea;
            text-decoration: none;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .edit-box {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #667eea;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 300px;
            font-family: inherit;
        }
        .row {
            display: flex;
            gap: 20px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .tip {
            color: #999;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>文章编辑</h1>
        <a href="/admin">← 返回文章列表</a>
    </div>

    <div class="container">
        <div class="edit-box">
            <form id="articleForm">
                <input type="hidden" id="id" th:value="${article?.id}">

                <div class="form-group">
                    <label>文章标题</label>
                    <input type="text" id="title" placeholder="请输入文章标题" th:value="${article?.title}" required>
                </div>

                <div class="form-group">
                    <label>文章摘要</label>
                    <textarea id="summary" rows="3" placeholder="一句话概括文章内容" th:text="${article?.summary}"></textarea>
                </div>

                <div class="form-group">
                    <label>文章内容</label>
                    <textarea id="content" placeholder="请输入文章内容，支持HTML标签" th:text="${article?.content}"></textarea>
                    <div class="tip">支持HTML标签，比如 &lt;p&gt;段落&lt;/p&gt;、&lt;h2&gt;标题&lt;/h2&gt;</div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>发布状态</label>
                        <select id="status">
                            <option value="1">立即发布</option>
                            <option value="0">存为草稿</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>分类ID（可选）</label>
                        <input type="text" id="categoryId" placeholder="分类ID" th:value="${article?.categoryId}">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">保存文章</button>
                    <a href="/admin" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        // 如果是编辑模式，设置状态下拉框
        var articleStatus = /*[[${article?.status}]]*/ null;
         if (articleStatus !== null) {
             document.getElementById('status').value = articleStatus;
         }
         document.getElementById('articleForm').addEventListener('submit', function(e) {
             e.preventDefault();
             var id = document.getElementById('id').value;
             var data = {
                 title: document.getElementById('title').value,
                 summary: document.getElementById('summary').value,
                 content: document.getElementById('content').value,
                 status: parseInt(document.getElementById('status').value),
                 categoryId: document.getElementById('categoryId').value || null
             };
             if (id) {
                 data.id = parseInt(id);
                 var url = '/api/article/update';
             } else {
                 var url = '/api/article/add';
             }
             fetch(url, {
                 method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify(data)
             })
             .then(res => res.json())
             .then(res => {
                 if (res.code === 200) {
                     alert(res.message);
                     window.location.href = '/admin';
                 } else {
                     alert(res.message);
                 }
             })
             .catch(err => {
                 alert('保存失败：' + err.message);
             });
         });
     </script>
 </body>
 </html>
