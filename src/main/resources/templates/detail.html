<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title}">文章详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
        }
        .header a {
            color: white;
            text-decoration: none;
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: -20px auto 30px;
            padding: 0 20px;
        }
        .article-detail {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .article-detail h1 {
            font-size: 28px;
            margin-bottom: 16px;
            color: #222;
        }
        .article-meta {
            display: flex;
            gap: 20px;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .article-content {
            line-height: 1.8;
            font-size: 16px;
            color: #444;
        }
        .article-content p {
            margin-bottom: 16px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/">← 返回首页</a>
    </div>

    <div class="container">
        <div class="article-detail">
            <h1 th:text="${article.title}">文章标题</h1>
            <div class="article-meta">
                <span>👁 浏览 <span th:text="${article.views}">0</span></span>
                <span>📅 <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</span></span>
            </div>
            <div class="article-content" th:utext="${article.content}">
                文章内容
            </div>
            <a href="/" class="back-btn">返回首页</a>
        </div>
    </div>
</body>
</html>
