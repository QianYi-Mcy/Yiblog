<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-default-theme=${site} != null ? ${site.theme} : 'green'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 文章管理</title>
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <script th:src="@{/js/theme.js}"></script>
    <style>
        .header {
            position: relative;
            z-index: 1;
            margin: 20px auto 0;
            max-width: 1200px;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        .header h1 {
            font-size: 20px;
            color: var(--text-main);
        }
        .header h1 .accent {
            color: var(--accent);
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .user-info span {
            color: var(--text-sub);
        }
        .header .user-info a {
            color: var(--accent);
            text-decoration: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .toolbar h2 {
            font-size: 18px;
            color: var(--text-main);
        }
        .article-table {
            background: rgba(255, 255, 255, 0.66);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        th {
            background: rgba(var(--accent-rgb), 0.06);
            font-weight: 600;
            color: var(--text-sub);
            font-size: 14px;
        }
        td {
            font-size: 14px;
            color: var(--text-main);
        }
        tbody tr {
            transition: background 0.2s;
        }
        tbody tr:hover {
            background: rgba(var(--accent-rgb), 0.05);
        }
        .title-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-published {
            color: #16a34a;
        }
        .status-draft {
            color: #faad14;
        }
        .action-links a {
            margin-right: 12px;
            text-decoration: none;
            font-size: 13px;
        }
        .edit-link {
            color: var(--accent);
        }
        .delete-link {
            color: #e74c3c;
        }
        .empty-tip {
            text-align: center;
            padding: 60px;
            color: var(--text-mute);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题配色">
        <span class="dot"></span>
        <span id="themeLabel">绿色主题</span>
    </button>

    <div class="header">
        <h1>博客后台管理<span class="accent">·</span>探索，永无止境</h1>
        <div class="user-info">
            <span>欢迎，<span th:text="${user.nickname}">管理员</span></span>
            <a href="/logout">退出登录</a>
        </div>
    </div>

    <div class="container">
        <div class="toolbar">
            <h2>文章管理</h2>
            <a href="/admin/article/add" class="btn-accent">+ 写新文章</a>
        </div>

        <div class="article-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>标题</th>
                        <th>浏览量</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.id}">1</td>
                        <td class="title-cell" th:text="${article.title}">文章标题</td>
                        <td th:text="${article.views}">0</td>
                        <td>
                            <span class="status-published" th:if="${article.status == 1}">已发布</span>
                            <span class="status-draft" th:if="${article.status == 0}">草稿</span>
                        </td>
                        <td th:text="${article.createTime}">2026-01-01</td>
                        <td class="action-links">
                            <a th:href="@{'/article/' + ${article.id}}" target="_blank" class="edit-link">查看</a>
                            <a th:href="@{'/admin/article/edit/' + ${article.id}}" class="edit-link">编辑</a>
                            <a th:href="@{'/admin/article/delete/' + ${article.id}}" class="delete-link" onclick="return confirm('确定删除这篇文章吗？')">删除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-tip" th:if="${#lists.isEmpty(articles)}">
                暂无文章，点击右上角"写新文章"开始创作吧！
            </div>
        </div>
    </div>
</body>
</html>
